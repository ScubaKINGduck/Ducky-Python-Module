name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install your local ducky package in editable mode along with its dependencies
          pip install -e .

      - name: Download NLTK models
        run: |
          # Ensuring the tokenizer text models are present for the Chatbot test
          python -m nltk.downloader punkt punkt_tab

      - name: Install Xvfb (Virtual Framebuffer for Tkinter/Turtle)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run tests
        run: xvfb-run -a python duck_test.py