[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ducky-python-module"
version = "0.1.4"
description = "Ducky Python module"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE.txt" }

authors = [
  { name = "Tom" }
]

# External modules your package depends on
dependencies = [
    "nltk>=3.8.0",  
    "requests>=2.30.0",
    "numpy>=1.26.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/ScubaKINGduck/Ducky-Python-Module"
Issues = "https://github.com/ScubaKINGduck/Ducky-Python-Module/issues"


